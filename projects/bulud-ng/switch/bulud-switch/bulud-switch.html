<span class="bulud-switch">
  <input
    class="bulud-switch__input"
    type="checkbox"
    role="switch"
    [id]="inputId()"
    [checked]="viewChecked()"
    [disabled]="isDisabled()"
    [required]="required()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-describedby]="ariaDescribedBy()"
    [attr.aria-errormessage]="ariaErrorMessage()"
    [attr.aria-invalid]="isInvalid() ? 'true' : null"
    (change)="handleChange($event)"
    (blur)="handleBlur()"
  />
  <label class="bulud-switch__label" [for]="inputId()">
    <span class="bulud-switch__track" aria-hidden="true">
      @if (appearance() === "theme") {
        <svg
          class="bulud-switch__theme-icon"
          [class.bulud-switch__theme-icon--moon]="viewChecked()"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          @if (viewChecked()) {
            <path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z" />
          } @else {
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"
            />
          }
        </svg>
      }
      <span class="bulud-switch__thumb"></span>
    </span>
    <span class="bulud-switch__content"><ng-content /></span>
  </label>
</span>
